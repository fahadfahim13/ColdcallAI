[tool.poetry]
name = "coldcallai"
version = "0.1.0"
description = "AI outbound cold calling agent"
authors = ["Fahad <fahadfahim13@gmail.com>"]
python = "^3.11"

[tool.poetry.dependencies]
python = "^3.11"

# Web framework
fastapi = "^0.111"
uvicorn = {extras = ["standard"], version = "^0.30"}
pydantic = "^2.7"
pydantic-settings = "^2.3"
websockets = "^12.0"
python-multipart = "^0.0.9"

# Database
asyncpg = "^0.29"
sqlalchemy = {extras = ["asyncio"], version = "^2.0"}
alembic = "^1.13"
qdrant-client = {extras = ["fastembed"], version = "^1.9"}

# LLM (Qwen vLLM uses OpenAI-compatible API)
openai = "^1.35"

# Voice / AI
torch = {version = "^2.3", extras = ["cpu"]}
numpy = "^1.26"
scipy = "^1.13"

# Audio / Telephony
phonenumbers = "^8.13"
audioop-lts = "^0.2"
aiohttp = "^3.9"

# Worker queue
arq = "^0.26"
redis = {extras = ["hiredis"], version = "^5.0"}

# Storage
minio = "^7.2"

# HTTP / utils
httpx = "^0.27"
twilio = "^9.0"
sse-starlette = "^2.1"
structlog = "^24.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-asyncio = "^0.23"
pytest-mock = "^3.14"
httpx = "^0.27"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
